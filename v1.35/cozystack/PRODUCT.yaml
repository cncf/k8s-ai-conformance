# Kubernetes AI Conformance Checklist
# Notes: This checklist is based on the Kubernetes AI Conformance document.
# Participants should fill in the 'status', 'evidence', and 'notes' fields for each requirement.

metadata:
  kubernetesVersion: v1.35
  platformName: Cozystack
  platformVersion: v1.6.1
  vendorName: Ænix
  websiteUrl: https://cozystack.io/
  repoUrl: https://github.com/cozystack/cozystack
  documentationUrl: https://cozystack.io/docs/
  productLogoUrl: https://raw.githubusercontent.com/cncf/artwork/main/projects/cozystack/horizontal/color/cozystack-horizontal-color.svg
  description: Cozystack is a CNCF platform and framework for building public and private clouds on bare metal, providing multi-tenant managed Kubernetes clusters, KubeVirt virtual machines and managed databases, with GPU support in both containers and virtual machines.
  k8sConformanceUrl: https://github.com/cncf/k8s-conformance/tree/master/v1.35/cozystack
  contactEmailAddress: info@aenix.io

spec:
  accelerators:
    - id: dra_support
      description: "Support Dynamic Resource Allocation (DRA) APIs to enable more flexible and fine-grained resource requests beyond simple counts."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#dynamic-resource-allocation
      notes: "Tenant Kubernetes clusters created by Cozystack serve resource.k8s.io/v1 with DeviceClass, ResourceClaim, ResourceClaimTemplate and ResourceSlice. Verified on a tenant cluster running Kubernetes v1.35.6 on Cozystack v1.6.1."

    - id: driver_runtime_management
      description: "Provide a verifiable mechanism for ensuring that compatible accelerator drivers and corresponding container runtime configurations are correctly installed and maintained on nodes with accelerators. Once the accelerator supports exposing driver and runtime version information as part of DRA, then the platform should use the DRA mechanism for verification."
      level: SHOULD
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#accelerator-drivers-and-runtime
      notes: "The NVIDIA GPU Operator ships as a first-class addon of the tenant Kubernetes application (addons.gpuOperator), which installs and maintains the driver, the NVIDIA Container Toolkit, the device plugin, GPU Feature Discovery and DCGM on nodes with accelerators."

    - id: gpu_sharing
      description: "For accelerators that support static GPU sharing, provide well-defined mechanisms for at least one GPU sharing strategy to improve utilization for workloads that do not require a full dedicated GPU. If hardware-level partitioning is supported, then these fractional GPU resources should be exposed as schedulable resources. If software-based sharing (e.g. time-slicing) is supported, then oversubscription of GPUs should be allowed. Forward-looking: Once the accelerator supports static GPU sharing as part of DRA, the platform should expose the DRA mechanism to allow users to leverage static GPU sharing. Once the accelerator supports dynamic GPU sharing as part of DRA and the partitionable devices feature is GA, the platform should expose the DRA mechanism to allow users to leverage dynamic GPU sharing."
      level: SHOULD
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#sharing-a-gpu-between-workloads
      notes: "Two strategies are available as addons. Hardware partitioning through MIG is exposed by the GPU Operator as schedulable resources. Software sharing and oversubscription are provided by HAMi, shipped as addons.hami."

    - id: virtualized_accelerator
      description: "For accelerators that support virtualized accelerator technologies (e.g. vGPU), provide well-defined mechanisms for these to be exposed and managed, maintaining consistency with physical fractional GPUs. Forward-looking: Once the accelerator supports virtualized accelerator technologies as part of DRA, then the platform should use the DRA mechanism."
      level: SHOULD
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#accelerators-in-virtual-machines
      notes: "Worker nodes of a tenant cluster run as KubeVirt virtual machines. A node pool declares the accelerators to attach through its gpus field, naming the device (for example nvidia.com/AD102GL_L40S), so a pool of virtual workers carries physical or virtualized GPUs and exposes them to the tenant cluster through the same resource model as bare-metal nodes."

  networking:
    - id: ai_inference
      description: "Support the Kubernetes Gateway API with an implementation for advanced traffic management for inference services, which enables capabilities like weighted traffic splitting, header-based routing (for OpenAI protocol headers), and optional integration with service meshes."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#gateway-api-for-inference-traffic
      notes: "Gateway API ships as an addon of the tenant Kubernetes application and Cilium, the platform CNI, provides the implementation: GatewayClass cilium with controller io.cilium/gateway-controller. Verified on a tenant cluster at Kubernetes v1.35.6 with a programmed Gateway and two accepted HTTPRoutes: weighted traffic splitting across two backends at 80/20, measured 26/4 over 30 requests, and header-based routing selecting a different backend on an X-Env request header."

  schedulingOrchestration:
    - id: gang_scheduling
      description: "The platform must allow for the installation and successful operation of at least one gang scheduling solution that ensures all-or-nothing scheduling for distributed AI workloads (e.g. Kueue, Volcano, etc.) To be conformant, the vendor must demonstrate that their platform can successfully run at least one such solution."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#gang-scheduling
      notes: "Kueue v0.19.4 installs and operates on a tenant cluster at Kubernetes v1.35.6. With a ClusterQueue holding a 2 CPU quota, a Job of two pods requesting 500m each was admitted as a unit and both pods ran; a Job of four pods requesting 1 CPU each was held suspended with zero pods scheduled, its Workload reporting insufficient quota rather than partially admitting the job. All-or-nothing admission is therefore demonstrated in both directions."

    - id: cluster_autoscaling
      description: "If the platform provides a cluster autoscaler or an equivalent mechanism, it must be able to scale up/down node groups containing specific accelerator types based on pending pods requesting those accelerators."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#scaling-node-pools-with-accelerators
      notes: "Node pools of a tenant cluster are Cluster API MachineDeployments driven by cluster-autoscaler. A pool declares minReplicas and maxReplicas as the autoscaler floor and ceiling, and declares the accelerators its nodes carry through its gpus field, so a pool of accelerator nodes scales on pods pending for that accelerator. Per-pool tuning is exposed through maxNodeProvisionTime, rendered onto the MachineDeployment as the cluster.x-k8s.io/autoscaling-options-maxnodeprovisiontime annotation."

    - id: pod_autoscaling
      description: "If the platform supports the HorizontalPodAutoscaler, it must function correctly for pods utilizing accelerators. This includes the ability to scale these Pods based on custom metrics relevant to AI/ML workloads."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#pod-autoscaling
      notes: "HorizontalPodAutoscaler is supported as part of the conformant Kubernetes control plane and applies to pods using accelerators without special handling, because accelerator pods are ordinary pods whose devices are allocated by the device plugin framework. Scaling on custom metrics relevant to AI workloads is served by the platform monitoring stack, which collects Prometheus-format metrics from the workload itself, such as a model server's queue depth or token throughput, and exposes them to the autoscaler. Vertical Pod Autoscaler additionally ships as an addon of the tenant Kubernetes application."

  observability:
    - id: accelerator_metrics
      description: "For supported accelerator types, the platform must allow for the installation and successful operation of at least one accelerator metrics solution that exposes fine-grained performance metrics via a standardized, machine-readable metrics endpoint. This must include a core set of metrics for per-accelerator utilization and memory usage. Additionally, other relevant metrics such as temperature, power draw, and interconnect bandwidth should be exposed if the underlying hardware or virtualization layer makes them available. The list of metrics should align with emerging standards, such as OpenTelemetry metrics, to ensure interoperability. The platform may provide a managed solution, but this is not required for conformance."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#accelerator-metrics
      notes: "The platform allows the installation and operation of an accelerator metrics solution, and ships one: the GPU Operator addon deploys the NVIDIA DCGM exporter, which publishes per-accelerator utilization and memory use as its core set, together with temperature, power draw and interconnect metrics where the hardware reports them, on a Prometheus exposition endpoint. The monitoringAgents addon discovers and scrapes it into the platform monitoring stack. Tenants are free to install a different solution instead, since neither addon is mandatory."

    - id: ai_service_metrics
      description: "Provide a monitoring system capable of discovering and collecting metrics from workloads that expose them in a standard format (e.g. Prometheus exposition format). This ensures easy integration for collecting key metrics from common AI frameworks and servers."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#metrics-from-ai-workloads
      notes: "The monitoringAgents addon deploys VMAgent, which discovers workloads through the standard ServiceMonitor and PodMonitor resources and scrapes Prometheus-format endpoints, including those of model servers such as vLLM."

  security:
    - id: secure_accelerator_access
      description: "Ensure that access to accelerators from within containers is properly isolated and mediated by the Kubernetes resource management framework (device plugin or DRA) and container runtime, preventing unauthorized access or interference between workloads."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#isolation-of-accelerator-access
      notes: "Accelerator access is mediated by the Kubernetes device plugin framework through the GPU Operator, and device nodes are injected into containers by the container runtime through the Container Device Interface rather than by privileged mounts. Tenant clusters add a second boundary: each tenant's workers are separate virtual machines with their own kernel, so an accelerator attached to one tenant's pool is not reachable from another tenant."

  operator:
    - id: robust_controller
      description: "The platform must prove that at least one complex AI operator with a CRD (e.g., Ray, Kubeflow) can be installed and functions reliably. This includes verifying that the operator's pods run correctly, its webhooks are operational, and its custom resources can be reconciled."
      level: MUST
      status: "Implemented"
      evidence:
        - https://cozystack.io/compliance/ai-conformance/#running-a-complex-ai-operator
      notes: "Demonstrated with two operators on a tenant cluster at Kubernetes v1.35.6. Kueue v0.19.4 covers all three parts of the requirement: its controller runs, it installs both MutatingWebhookConfiguration and ValidatingWebhookConfiguration with their serving service, and those webhooks are demonstrably operational because admission of a batch/v1 Job is what sets its suspend field. Its own custom resources (ClusterQueue, LocalQueue, Workload) reconcile. KubeRay v1.7.0 is recorded as a second example of reconciliation: the operator runs and a RayCluster reaches state ready with head and worker pods scheduled and status conditions maintained. Noted for accuracy: a default KubeRay v1.7.0 installation deploys no admission or conversion webhooks, so the webhook part of this requirement rests on Kueue rather than on KubeRay."
