# Kubernetes AI Conformance Checklist - v1.37
# Notes: This checklist is based on the Kubernetes AI Conformance document.
# Participants should fill in the 'status', 'evidence', and 'notes' fields for each requirement.
#
# Hybrid Verification Approach for v1.37:
# - For requirements with automated tests (e.g., Secure Accelerator Access, Gang Scheduling),
#   you can link to the test output files (e.g., e2e.log, junit.xml) in the 'evidence' list.
# - For requirements without automated tests, please provide manual evidence (e.g., documentation URLs,
#   screenshots, or self-attestation logs).
#
# Example of evidence for automated test:
#   evidence:
#     - "file://results/junit.xml#TestSecureAcceleratorAccess"
#     - "file://results/e2e.log"
#
# Example of evidence for manual verification:
#   evidence:
#     - "https://docs.vendor.com/features/workload-sandboxing"

metadata:
  kubernetesVersion: v1.37
  platformName: "Nscale Managed Kubernetes"
  platformVersion: "v1.37.2-nks.1"
  vendorName: "Nscale"
  websiteUrl: "https://nscale.com"
  repoUrl: ""
  documentationUrl: "https://docs.nscale.com/docs/compute/managed-kubernetes"
  productLogoUrl: "https://raw.githubusercontent.com/nscaledev/media-kit/refs/heads/main/02%20Logo/01%20Full%20logo/01%20Vector%20WEB%20(SVG)/Nscale-logo_midnight.svg"
  description: "NKS is Nscale's Managed Kubernetes Service, a fully-managed Kubernetes environment with infrastructure integration designed for AI training and inference."
  contactEmailAddress: "sales@nscale.com"
  k8sConformanceUrl: "https://github.com/cncf/k8s-conformance/tree/master/v1.37/nks"

spec:
  accelerators:
    - id: driver_runtime_management
      description: "Provide a verifiable mechanism for ensuring that compatible accelerator drivers and corresponding container runtime configurations are correctly installed and maintained on nodes with accelerators. Once the accelerator supports exposing driver and runtime version information as part of DRA, then the platform should use the DRA mechanism for verification."
      level: SHOULD
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestAcceleratorDriverRuntimeManagement"
        - "file://v1.37/nks/junit.xml#TestAcceleratorDriverRuntimeManagement"
        - "file://v1.37/nks/e2e.log"
        - "https://docs.nscale.com/docs/compute/reservations"
      notes: "TestAcceleratorDriverRuntimeManagement passed. Reservation-backed GPU hosts boot an NKS image with the NVIDIA driver installed, and the NKS hardware add-on (enabled by default) runs the NVIDIA DRA driver, which advertises the driver version (595.91.07) on each GPU device's ResourceSlice. The test verified the advertised version against the driver a pod observed. Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
    - id: gpu_sharing
      description: "For accelerators that support static GPU sharing, provide well-defined mechanisms for at least one GPU sharing strategy to improve utilization for workloads that do not require a full dedicated GPU. If hardware-level partitioning is supported, then these fractional GPU resources should be exposed as schedulable resources. If software-based sharing (e.g. time-slicing) is supported, then oversubscription of GPUs should be allowed. Forward-looking: Once the accelerator supports static GPU sharing as part of DRA, the platform should expose the DRA mechanism to allow users to leverage static GPU sharing. Once the accelerator supports dynamic GPU sharing as part of DRA and the partitionable devices feature is GA, the platform should expose the DRA mechanism to allow users to leverage dynamic GPU sharing."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "Not demonstrated in this submission. GPUs are exposed as whole devices through the NVIDIA DRA driver."
    - id: virtualized_accelerator
      description: "For accelerators that support virtualized accelerator technologies (e.g. vGPU), provide well-defined mechanisms for these to be exposed and managed, maintaining consistency with physical fractional GPUs. Forward-looking: Once the accelerator supports virtualized accelerator technologies as part of DRA, then the platform should use the DRA mechanism."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "Not applicable to the offering as submitted: reservation-backed GPU capacity is bare metal, with whole physical GPUs exposed through DRA, and no vGPU integration is provided."
  networking:
    - id: ai_inference
      description: "Support the Kubernetes Gateway API with an implementation for advanced traffic management for inference services, which enables capabilities like weighted traffic splitting, header-based routing (for OpenAI protocol headers), and optional integration with service meshes."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestGatewayAPIInference"
        - "file://v1.37/nks/junit.xml#TestGatewayAPIInference"
        - "file://v1.37/nks/e2e.log"
      notes: "TestGatewayAPIInference passed with the Gateway API v1.6.3 CRDs and agentgateway v1.7.0 installed as add-ons, using a GatewayClass (agentgateway-clusterip) whose Gateways are exposed as ClusterIP Services. Requests carrying the model header were all routed to the matching backend, and the remaining traffic was split 70/30 across two backends by HTTPRoute weight, within the 5% tolerance of the upstream Gateway API conformance test. Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
    - id: advanced_inference_ingress
      description: "Support an implementation of the Gateway API Inference Extension (GAIE), which can route requests to models hosted on Kubernetes. The implementation supports serving LLMs and making advanced routing decisions (e.g., K/V cache-aware routing) based on metrics and capabilities advertised by the underlying model serving platform."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "Not demonstrated in this submission."
    - id: high_performance_networking
      description: "If high performance pod-to-pod communication is needed, then provide well-defined mechanisms for these specialized network resources to be managed and exposed such that their characteristics should be discoverable to enable informed scheduling or workload configuration and to enable pods to attach to multiple network interfaces. Platforms should use DRA as the mechanism to manage and expose these specialized network resources (e.g., DRANET)."
      level: SHOULD
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/high-performance-networking.log"
        - "https://github.com/kubernetes-sigs/dranet"
      notes: "The NKS hardware add-on (enabled by default) runs DRANET v1.5.0 on every node, which publishes each node's network interfaces as dra.net devices in ResourceSlices. Each reservation-backed GPU host advertises its Mellanox InfiniBand interfaces with their characteristics (interface name, encapsulation, RDMA capability and RDMA device, PCI address, NUMA node, PCIe root, MTU, SR-IOV), and the rdma.nscale.com DeviceClass selects the eight RDMA interfaces per host on the GPU fabric, so a workload can claim them through DRA as additional pod network interfaces. The upstream suite has no automated test for this requirement; high-performance-networking.log is a read-only capture of the DeviceClass and the published devices from the cluster used for this run."
    - id: disaggregated_inference
      description: "Support the deployment and operation of disaggregated inference architectures. To be conformant, the platform should demonstrate that it can successfully install and run a disaggregated inference solution (e.g., vLLM, SGLang, llm-d, or Dynamo, with separate instances for distinct phases like prefill and decode). Disaggregated serving splits phases such as prefill and decode into separately scalable components so each phase can match different compute/memory/network needs, improving GPU utilization and tail latency while enabling higher throughput under mixed and bursty LLM workloads."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "Not demonstrated in this submission."
  schedulingOrchestration:
    - id: gang_scheduling
      description: "The platform must allow for the installation and successful operation of at least one gang scheduling solution that ensures all-or-nothing scheduling for distributed AI workloads (e.g. Kueue, Volcano, etc.) To be conformant, the vendor must demonstrate that their platform can successfully run at least one such solution."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestGangScheduling"
        - "file://v1.37/nks/junit.xml#TestGangScheduling"
        - "file://v1.37/nks/e2e.log"
      notes: "TestGangScheduling passed, positive and negative cases, with Kueue v0.18.2 installed as an add-on (LocalQueue admission, kueue.x-k8s.io/queue-name label). Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
    - id: cluster_autoscaling
      description: "If the platform provides a cluster autoscaler or an equivalent mechanism, it must be able to scale up/down node groups containing specific accelerator types based on pending pods requesting those accelerators."
      level: MUST
      status: "N/A"
      evidence: []
      notes: "NKS does not provide a cluster autoscaler. Accelerator capacity is supplied by reservation-backed node pools, which are sized to the reservation when they are created and cannot be resized, so there is no node group to scale on pending accelerator pods. TestAcceleratorClusterAutoscaling was not run."
    - id: pod_autoscaling
      description: "If the platform supports the HorizontalPodAutoscaler, it must function correctly for pods utilizing accelerators. This includes the ability to scale these Pods based on custom metrics relevant to AI/ML workloads."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestHPAAutoscaling"
        - "file://v1.37/nks/junit.xml#TestHPAAutoscaling"
        - "file://v1.37/nks/e2e.log"
      notes: "TestHPAAutoscaling passed. A HorizontalPodAutoscaler scaled a Deployment whose pods each claim one GPU through DRA from 1 to 2 replicas and back, on a custom metric served by prometheus-adapter 5.3.0 from kube-prometheus-stack 91.9.0, both installed as add-ons. Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
  observability:
    - id: accelerator_metrics
      description: "For supported accelerator types, the platform must allow for the installation and successful operation of at least one accelerator metrics solution that exposes fine-grained performance metrics via a standardized, machine-readable metrics endpoint. This must include a core set of metrics for per-accelerator utilization and memory usage. Additionally, other relevant metrics such as temperature, power draw, and interconnect bandwidth should be exposed if the underlying hardware or virtualization layer makes they available. The list of metrics should align with emerging standards, such as OpenTelemetry metrics, to ensure interoperability. The platform may provide a managed solution, but this is not required for conformance."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestAcceleratorPerformanceMetrics"
        - "file://v1.37/nks/junit.xml#TestAcceleratorPerformanceMetrics"
        - "file://v1.37/nks/e2e.log"
      notes: "TestAcceleratorPerformanceMetrics passed, including the optional metrics. The NKS hardware add-on runs NVIDIA dcgm-exporter (nvidia-platform/nvidia-dcgm-exporter-dra), which exposes per-GPU utilization, memory, temperature and power in Prometheus format. Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
    - id: ai_service_metrics
      description: "Provide a monitoring system capable of discovering and collecting metrics from workloads that expose them in a standard format (e.g. Prometheus exposition format). This ensures easy integration for collecting key metrics from common AI frameworks and servers."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestAIServiceMetrics"
        - "file://v1.37/nks/junit.xml#TestAIServiceMetrics"
        - "file://v1.37/nks/e2e.log"
      notes: "TestAIServiceMetrics passed with kube-prometheus-stack 91.9.0 installed as an add-on: Prometheus discovered the test workload through a ServiceMonitor and collected its request count, latency and queue depth metrics. Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
  security:
    - id: secure_accelerator_access
      description: "Ensure that access to accelerators from within containers is properly isolated and mediated by the Kubernetes resource management framework (device plugin or DRA) and container runtime, preventing unauthorized access or interference between workloads."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestSecureAcceleratorAccess"
        - "file://v1.37/nks/junit.xml#TestSecureAcceleratorAccess"
        - "file://v1.37/nks/e2e.log"
      notes: "TestSecureAcceleratorAccess passed. GPU access is mediated by the NVIDIA DRA driver delivered by the NKS hardware add-on: a pod sees only the GPU allocated to its ResourceClaim, and pods or containers without a claim see none. Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
    - id: workload_sandboxing
      description: "Provide a mechanism to run workloads in a sandbox that provides strong isolation from the host node kernel. This is crucial for AI agent use cases that may execute untrusted code. The sandbox should isolate the workload's process, memory, filesystem, and network access from the host node and other co-located pods."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "NKS does not provide a sandboxed RuntimeClass such as gVisor or Kata Containers. TestWorkloadSandboxing was skipped for this reason."
  operator:
    - id: robust_controller
      description: "The platform must prove that at least one complex AI operator with a CRD (e.g., Ray, Kubeflow) can be installed and functions reliably. This includes verifying that the operator's pods run correctly, its webhooks are operational, and its custom resources can be reconciled."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.37/nks/results.json#TestRobustCRDControllerOperation"
        - "file://v1.37/nks/junit.xml#TestRobustCRDControllerOperation"
        - "file://v1.37/nks/e2e.log"
      notes: "TestRobustCRDControllerOperation passed with Kubeflow Trainer 2.3.0 installed as an add-on with Helm (operator pods, CRDs, validating webhook and TrainJob reconciliation). Run on an NKS cluster (Kubernetes v1.37.2) with three compute workers and a reservation-backed node pool of two bare-metal hosts, each with 8 NVIDIA B200 GPUs exposed through DRA (gpu.nvidia.com), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@fd9ba2d8)."
