# Kubernetes AI Conformance Checklist
# Notes: This checklist is based on the Kubernetes AI Conformance document.
# Participants should fill in the 'status', 'evidence', and 'notes' fields for each requirement.

metadata:
  kubernetesVersion: v1.36
  platformName: "Kubermatic Kubernetes Platform"
  platformVersion: "v2.31"
  vendorName: "Kubermatic"
  websiteUrl: "https://www.kubermatic.com/"
  repoUrl: "https://github.com/kubermatic/kubermatic"
  documentationUrl: "https://docs.kubermatic.com/"
  productLogoUrl: "https://www.kubermatic.com/static/kubermatic-kubernetes-platform.svg"
  description: "Kubermatic Kubernetes Platform is an open source project to centrally manage the global automation of thousands of Kubernetes clusters across multicloud, on-prem and edge."
  contactEmailAddress: "support@kubermatic.com"
  k8sConformanceUrl: https://github.com/cncf/k8s-conformance/tree/master/v1.36/kubermatic
spec:
  accelerators:
    - id: driver_runtime_management
      description: "Provide a verifiable mechanism for ensuring that compatible accelerator drivers and corresponding container runtime configurations are correctly installed and maintained on nodes with accelerators. Once the accelerator supports exposing driver and runtime version information as part of DRA, then the platform should use the DRA mechanism for verification."
      level: SHOULD
      status: "Implemented"
      evidence:
        - "file://v1.36/kubermatic/results.json#TestAcceleratorDriverRuntimeManagement"
        - "file://v1.36/kubermatic/junit.xml#TestAcceleratorDriverRuntimeManagement"
        - "file://v1.36/kubermatic/e2e.log"
        - https://docs.kubermatic.com/kubermatic/v2.31/architecture/concept/kkp-concepts/applications/default-applications-catalog/nvidia-gpu-operator/
      notes: "TestAcceleratorDriverRuntimeManagement passed. NVIDIA GPU Operator v26.3.3 from the KKP application catalog installs and maintains the driver and container toolkit on GPU nodes, and GPU Feature Discovery advertises the driver version as a node label. Run on a KKP user cluster (Kubernetes v1.36.5) on AWS with one NVIDIA T4 node (g4dn.xlarge), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@b66dc798)."
    - id: gpu_sharing
      description: "For accelerators that support static GPU sharing, provide well-defined mechanisms for at least one GPU sharing strategy to improve utilization for workloads that do not require a full dedicated GPU. If hardware-level partitioning is supported, then these fractional GPU resources should be exposed as schedulable resources. If software-based sharing (e.g. time-slicing) is supported, then oversubscription of GPUs should be allowed. Forward-looking: Once the accelerator supports static GPU sharing as part of DRA, the platform should expose the DRA mechanism to allow users to leverage static GPU sharing. Once the accelerator supports dynamic GPU sharing as part of DRA and the partitionable devices feature is GA, the platform should expose the DRA mechanism to allow users to leverage dynamic GPU sharing."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "Not documented for KKP and not demonstrated in this submission. The NVIDIA GPU Operator in the KKP application catalog supports time-slicing and MIG through its own configuration."
    - id: virtualized_accelerator
      description: "For accelerators that support virtualized accelerator technologies (e.g. vGPU), provide well-defined mechanisms for these to be exposed and managed, maintaining consistency with physical fractional GPUs. Forward-looking: Once the accelerator supports virtualized accelerator technologies as part of DRA, then the platform should use the DRA mechanism."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "KKP does not ship a vGPU integration. vGPU depends on NVIDIA vGPU licensing and supported hardware; not demonstrated in this submission."
  networking:
    - id: ai_inference
      description: "Support the Kubernetes Gateway API with an implementation for advanced traffic management for inference services, which enables capabilities like weighted traffic splitting, header-based routing (for OpenAI protocol headers), and optional integration with service meshes."
      level: MUST
      status: "Implemented"
      evidence: ['https://docs.kubermatic.com/kubermatic/v2.31/tutorials-howtos/kubelb/', 'https://docs.kubermatic.com/kubelb/v1.5/tutorials/gatewayapi/', 'https://docs.kubermatic.com/kubelb/v1.5/tutorials/ai/', 'https://docs.kubermatic.com/kubermatic/v2.31/tutorials-howtos/networking/ai-inference-routing/']
      notes: "KKP integrates KubeLB, which provides the Kubernetes Gateway API for user clusters with Envoy Gateway as the implementation. HTTPRoute supports weighted backendRefs for traffic splitting and header matches for routing. KubeLB also ships agentgateway, an Envoy-based gateway for LLM, MCP and Agent-to-Agent traffic. Gateway API implementations such as kgateway can also be installed directly in a KKP user cluster, as the AI inference routing guide shows."
    - id: advanced_inference_ingress
      description: "Support an implementation of the Gateway API Inference Extension (GAIE), which can route requests to models hosted on Kubernetes. The implementation supports serving LLMs and making advanced routing decisions (e.g., K/V cache-aware routing) based on metrics and capabilities advertised by the underlying model serving platform."
      level: SHOULD
      status: "Implemented"
      evidence:
        - https://docs.kubermatic.com/kubermatic/v2.31/tutorials-howtos/networking/ai-inference-routing/
      notes: "The AI inference routing guide deploys the Gateway API Inference Extension with kgateway in a KKP user cluster, using InferencePool and the Endpoint Picker for model-aware routing."
    - id: high_performance_networking
      description: "If high performance pod-to-pod communication is needed, then provide well-defined mechanisms for these specialized network resources to be managed and exposed such that their characteristics should be discoverable to enable informed scheduling or workload configuration and to enable pods to attach to multiple network interfaces. Platforms should use DRA as the mechanism to manage and expose these specialized network resources (e.g., DRANET)."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "KKP does not ship RDMA or GPUDirect networking components or a DRA driver for network devices; not demonstrated in this submission."
    - id: disaggregated_inference
      description: "Support the deployment and operation of disaggregated inference architectures. To be conformant, the platform should demonstrate that it can successfully install and run a disaggregated inference solution (e.g., vLLM, SGLang, llm-d, or Dynamo, with separate instances for distinct phases like prefill and decode). Disaggregated serving splits phases such as prefill and decode into separately scalable components so each phase can match different compute/memory/network needs, improving GPU utilization and tail latency while enabling higher throughput under mixed and bursty LLM workloads."
      level: SHOULD
      status: "Not Implemented"
      evidence: []
      notes: "KKP does not ship a disaggregated prefill/decode inference stack; not demonstrated in this submission."
  schedulingOrchestration:
    - id: gang_scheduling
      description: "The platform must allow for the installation and successful operation of at least one gang scheduling solution that ensures all-or-nothing scheduling for distributed AI workloads (e.g. Kueue, Volcano, etc.) To be conformant, the vendor must demonstrate that their platform can successfully run at least one such solution."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.36/kubermatic/results.json#TestGangScheduling"
        - "file://v1.36/kubermatic/junit.xml#TestGangScheduling"
        - "file://v1.36/kubermatic/e2e.log"
        - https://docs.kubermatic.com/kubermatic/v2.31/architecture/concept/kkp-concepts/applications/default-applications-catalog/kueue/
      notes: "TestGangScheduling passed with Kueue v0.19.6 installed from the KKP application catalog. Run on a KKP user cluster (Kubernetes v1.36.5) on AWS with one NVIDIA T4 node (g4dn.xlarge), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@b66dc798)."
    - id: cluster_autoscaling
      description: "If the platform provides a cluster autoscaler or an equivalent mechanism, it must be able to scale up/down node groups containing specific accelerator types based on pending pods requesting those accelerators."
      level: MUST
      status: "Implemented"
      evidence:
        - https://docs.kubermatic.com/kubermatic/v2.31/tutorials-howtos/kkp-autoscaler/cluster-autoscaler/
      notes: "KKP ships the Kubernetes cluster-autoscaler as an application in the default catalog (EE). It scales MachineDeployments based on pending pods, within the min and max size set by annotations on each MachineDeployment."
    - id: pod_autoscaling
      description: "If the platform supports the HorizontalPodAutoscaler, it must function correctly for pods utilizing accelerators. This includes the ability to scale these Pods based on custom metrics relevant to AI/ML workloads."
      level: MUST
      status: "Implemented"
      evidence:
        - https://docs.kubermatic.com/kubermatic/v2.31/tutorials-howtos/hpa-with-custom-gpu-metrics/
      notes: "The HorizontalPodAutoscaler works with GPU workloads in KKP user clusters. The guide scales a Deployment that requests nvidia.com/gpu on the DCGM GPU utilization metric, collected by Prometheus and exposed to the HPA through the Prometheus Adapter."
  observability:
    - id: accelerator_metrics
      description: "For supported accelerator types, the platform must allow for the installation and successful operation of at least one accelerator metrics solution that exposes fine-grained performance metrics via a standardized, machine-readable metrics endpoint. This must include a core set of metrics for per-accelerator utilization and memory usage. Additionally, other relevant metrics such as temperature, power draw, and interconnect bandwidth should be exposed if the underlying hardware or virtualization layer makes them available. The list of metrics should align with emerging standards, such as OpenTelemetry metrics, to ensure interoperability. The platform may provide a managed solution, but this is not required for conformance."
      level: MUST
      status: "Implemented"
      evidence:
        - https://docs.kubermatic.com/kubermatic/v2.31/architecture/concept/kkp-concepts/applications/default-applications-catalog/nvidia-gpu-operator/
        - https://docs.kubermatic.com/kubermatic/v2.31/architecture/monitoring-logging-alerting/user-cluster/
      notes: "NVIDIA GPU Operator from the KKP application catalog deploys dcgm-exporter by default, which exposes per-GPU utilization, memory and temperature metrics in Prometheus format. KKP user cluster MLA collects them."
    - id: ai_service_metrics
      description: "Provide a monitoring system capable of discovering and collecting metrics from workloads that expose them in a standard format (e.g. Prometheus exposition format). This ensures easy integration for collecting key metrics from common AI frameworks and servers."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.36/kubermatic/results.json#TestAIServiceMetrics"
        - "file://v1.36/kubermatic/junit.xml#TestAIServiceMetrics"
        - "file://v1.36/kubermatic/e2e.log"
        - https://docs.kubermatic.com/kubermatic/v2.31/architecture/monitoring-logging-alerting/user-cluster/
        - https://docs.kubermatic.com/kubermatic/v2.31/tutorials-howtos/monitoring-logging-alerting/user-cluster/user-guide/
      notes: "TestAIServiceMetrics passed with KKP user cluster MLA. The test workload is scraped through an MLA custom scrape config (a ConfigMap with the monitoring-scraping- prefix in mla-system), and its metrics are queried from Cortex through the MLA gateway. Run on a KKP user cluster (Kubernetes v1.36.5) on AWS with one NVIDIA T4 node (g4dn.xlarge), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@b66dc798)."
  security:
    - id: secure_accelerator_access
      description: "Ensure that access to accelerators from within containers is properly isolated and mediated by the Kubernetes resource management framework (device plugin or DRA) and container runtime, preventing unauthorized access or interference between workloads."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.36/kubermatic/results.json#TestSecureAcceleratorAccess"
        - "file://v1.36/kubermatic/junit.xml#TestSecureAcceleratorAccess"
        - "file://v1.36/kubermatic/e2e.log"
      notes: "TestSecureAcceleratorAccess passed. Accelerator access is mediated by the NVIDIA device plugin from NVIDIA GPU Operator v26.3.3, installed from the KKP application catalog: a pod sees only the GPUs it requests, and pods or containers without a request see none. Run on a KKP user cluster (Kubernetes v1.36.5) on AWS with one NVIDIA T4 node (g4dn.xlarge), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@b66dc798)."
  operator:
    - id: robust_controller
      description: "The platform must prove that at least one complex AI operator with a CRD (e.g., Ray, Kubeflow) can be installed and functions reliably. This includes verifying that the operator's pods run correctly, its webhooks are operational, and its custom resources can be reconciled."
      level: MUST
      status: "Implemented"
      evidence:
        - "file://v1.36/kubermatic/results.json#TestRobustCRDControllerOperation"
        - "file://v1.36/kubermatic/junit.xml#TestRobustCRDControllerOperation"
        - "file://v1.36/kubermatic/e2e.log"
      notes: "TestRobustCRDControllerOperation passed with Kubeflow Trainer v2.3.0 (operator pods, CRDs, validating webhook and TrainJob reconciliation). Trainer was installed with Helm. Run on a KKP user cluster (Kubernetes v1.36.5) on AWS with one NVIDIA T4 node (g4dn.xlarge), using the upstream AI Conformance test suite (kubernetes-sigs/ai-conformance@b66dc798)."
